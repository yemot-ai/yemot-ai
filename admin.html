<!doctype html>
<html lang="he" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>חדר הבקרה של הקו</title>
<style>::selection{background:#ff7a1a55}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&family=Heebo:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F3EF;--paper:#FFFFFF;--ink:#1A1512;--mute:#7A6F66;--line:#E8E0D8;
  --navy:#141110;--navy2:#221C18;--teal:#FF7A1A;--teal-soft:#FFE7D3;--amber:#FFB020;--amber-soft:#FFF1CC;
  --coral:#E23D28;--coral-soft:#FBDDD6;--blue:#FF9A3C;--blue-soft:#FFE3C7;
  --r:14px;--r-sm:9px;--shadow:0 1px 0 #0000000a,0 10px 30px -18px #1a151240;
}
[data-theme=dark]{
  --bg:#0A0908;--paper:#15120fcc;--ink:#F5EFE8;--mute:#A79B90;--line:#2C2520;
  --navy:#070605;--navy2:#100D0B;--teal-soft:#3a2010;--amber-soft:#3a2a0c;--coral-soft:#3d1a14;--blue-soft:#3a2410;
  --shadow:0 1px 0 #00000030,0 20px 50px -24px #000d;
}
[data-theme=dark] body{background:
  radial-gradient(900px 520px at 10% -10%,#ff7a1a2e,transparent 60%),
  radial-gradient(700px 500px at 100% 25%,#ff9a3c1c,transparent 60%),
  radial-gradient(600px 400px at 60% 110%,#e23d2818,transparent 60%),var(--bg);background-attachment:fixed}
[data-theme=dark] .panel,[data-theme=dark] .key,[data-theme=dark] .live-badge{backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
[data-theme=dark] .board{background:linear-gradient(135deg,#141008 0%,#1c130a 60%,#120e09 100%);border:1px solid #ff7a1a2a}
[data-theme=dark] .side{background:linear-gradient(180deg,#070605 0%,#130e0a 100%);border-left:1px solid #ff7a1a22}
[data-theme=dark] .stat{background:#ffffff08}
[data-theme=dark] input[type=text],[data-theme=dark] input[type=number],[data-theme=dark] input[type=password],[data-theme=dark] select,[data-theme=dark] textarea{background:#0f0c0acc}
[data-theme=dark] .msg.a{background:#1a1511}[data-theme=dark] .typing{background:#1a1511}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Heebo,Arial,sans-serif;font-size:15px;line-height:1.5}
h1,h2,h3,.num,.key b{font-family:Rubik,Heebo,Arial,sans-serif}
a{color:var(--blue)}
button{font:inherit}
input[type=text],input[type=number],input[type=password],select,textarea{
  width:100%;padding:8px 11px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--paper);color:var(--ink);font:inherit}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--teal);outline-offset:1px}
textarea{min-height:72px;resize:vertical;line-height:1.55}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border:0;border-radius:var(--r-sm);background:var(--navy);color:#fff;cursor:pointer;transition:transform .08s,filter .15s;text-decoration:none}
.btn:hover{filter:brightness(1.12)}.btn:active{transform:translateY(1px)}
.btn.sm{padding:5px 10px;font-size:13px}.btn.teal{background:var(--teal)}.btn.amber{background:var(--amber);color:#3b2a00}.btn.coral{background:var(--coral)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}.btn.blue{background:var(--blue)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap}
.pill.teal{background:var(--teal-soft);color:#9a3f05}.pill.amber{background:var(--amber-soft);color:#7a4d00}.pill.coral{background:var(--coral-soft);color:#8a2a12}.pill.blue{background:var(--blue-soft);color:#8a3d05}.pill.gray{background:var(--line);color:var(--mute)}
[data-theme=dark] .pill.teal{color:#ffb070}[data-theme=dark] .pill.amber{color:#ffd27a}[data-theme=dark] .pill.coral{color:#ff9f83}[data-theme=dark] .pill.blue{color:#ffc08a}
.mute{color:var(--mute)}.small{font-size:13px}

/* ---------- shell */
.shell{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.side{background:linear-gradient(180deg,var(--navy) 0%,var(--navy2) 100%);color:#fff;padding:22px 0;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:10px;padding:0 20px 22px;border-bottom:1px solid #ffffff14;margin-bottom:10px}
.brand svg{width:34px;height:34px;flex-shrink:0}
.brand h1{font-size:17px;margin:0;font-weight:500;letter-spacing:.2px}.brand .small{color:#b39c8a}
.nav{display:flex;flex-direction:column;padding:6px 10px;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:#d9cfc6;text-decoration:none;cursor:pointer;font-weight:400}
.nav a svg{width:18px;height:18px;opacity:.85}
